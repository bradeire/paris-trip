<style>
  /* ============ Material Design 3 tokens ============ */
  :root{
    color-scheme: light;
    /* Core M3 roles — light, airy tonal palette */
    --md-primary: #5C63C9;
    --md-on-primary: #FFFFFF;
    --md-primary-container: #E2E0FF;
    --md-on-primary-container: #12144C;

    --md-secondary: #5D5C72;
    --md-secondary-container: #E2E0F9;
    --md-on-secondary-container: #1A1A2C;

    --md-surface: #FBFCF8;
    --md-surface-dim: #F1F2EC;
    --md-surface-bright: #FBFCF8;
    --md-surface-container-lowest: #FFFFFF;
    --md-surface-container-low: #F5F6F0;
    --md-surface-container: #EFF0EA;
    --md-surface-container-high: #E9EAE4;
    --md-on-surface: #1B1C18;
    --md-on-surface-variant: #46473F;
    --md-outline: #C9CABE;
    --md-outline-variant: #E1E2D6;

    /* category tonal roles (M3 "extended" tertiary-style hues) */
    --paris: #8B4A17;
    --paris-container: #FFDDBB;
    --forest: #2E6A45;
    --forest-container: #B6F0C4;
    --disney: #6750A4;
    --disney-container: #EADDFF;
    --travel: #3A5B6E;
    --travel-container: #CDE7F6;
    --warn: #8C4A2F;
    --warn-container: #FFDBCB;

    --elev1: 0 1px 2px rgba(0,0,0,0.06), 0 1px 3px 1px rgba(0,0,0,0.05);
    --elev2: 0 1px 2px rgba(0,0,0,0.07), 0 2px 6px 2px rgba(0,0,0,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    background:var(--md-surface);
    color:var(--md-on-surface);
    font-family:'Roboto Flex','Roboto',sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .wrap{max-width:760px;margin:0 auto;padding:0 0 48px;}

  /* ===== Top app bar (M3) ===== */
  .appbar{
    position:sticky; top:0; z-index:20;
    background:var(--md-surface-container-low);
    padding: max(14px, env(safe-area-inset-top)) 20px 14px;
    border-bottom:1px solid var(--md-outline-variant);
  }
  .appbar .row{display:flex; align-items:center; gap:12px;}
  .appbar .icon-badge{
    width:40px; height:40px; border-radius:12px;
    background:var(--md-primary-container); color:var(--md-on-primary-container);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .appbar .icon-badge svg{width:22px;height:22px;}
  .appbar h1{
    font-family:'Roboto',sans-serif; font-size:20px; font-weight:500; margin:0; line-height:1.2;
    color:var(--md-on-surface);
  }
  .appbar .meta{font-size:12.5px; color:var(--md-on-surface-variant); margin-top:1px;}

  .content{padding:16px 16px 0;}

  /* ===== Notices as M3 tonal banners ===== */
  .notices{display:flex; flex-direction:column; gap:10px; margin-bottom:18px;}
  .notice{
    border-radius:16px; padding:14px 16px; font-size:13.5px; line-height:1.55;
    display:flex; gap:12px; align-items:flex-start;
  }
  .notice svg{width:20px;height:20px;flex-shrink:0; margin-top:1px;}
  .notice.warn{background:var(--warn-container); color:#3D2113;}
  .notice.warn svg{color:var(--warn);}
  .notice.info{background:var(--travel-container); color:#12303D;}
  .notice.info svg{color:var(--travel);}
  .notice b{font-weight:700;}

  /* ===== Day chip nav (M3 filter chips) ===== */
  .chip-scroll{
    display:flex; gap:8px; overflow-x:auto; padding:2px 2px 14px;
    scrollbar-width:none;
  }
  .chip-scroll::-webkit-scrollbar{display:none;}
  .chip{
    flex-shrink:0;
    font-family:'Roboto',sans-serif; font-size:13px; font-weight:500;
    border:1px solid var(--md-outline);
    background:var(--md-surface-container-lowest);
    color:var(--md-on-surface-variant);
    border-radius:100px;
    padding:9px 16px 9px 14px;
    cursor:pointer;
    display:flex; flex-direction:column; align-items:flex-start; gap:1px;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .chip .d{font-size:11.5px; opacity:.85;}
  .chip .t{font-weight:500;}
  .chip.active{
    background:var(--md-primary); border-color:var(--md-primary); color:var(--md-on-primary);
  }
  .chip.active .d{color:#DCDBFF;}

  /* ===== Day panel ===== */
  .day-panel{display:none;}
  .day-panel.active{display:block; animation:rise .22s ease;}
  @keyframes rise{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  .day-head{margin-bottom:14px; padding:0 2px;}
  .day-head h2{font-family:'Roboto',sans-serif; font-weight:500; font-size:22px; margin:0 0 2px; letter-spacing:-.01em;}
  .day-head .loc{font-size:13px; color:var(--md-on-surface-variant);}

  /* timeline */
  .timeline{position:relative; padding-left:22px; margin-bottom:4px;}
  .timeline::before{content:""; position:absolute; left:5px; top:8px; bottom:8px; width:2px; background:var(--md-outline-variant); border-radius:2px;}
  .item{position:relative; margin-bottom:12px;}
  .item::before{
    content:""; position:absolute; left:-22px; top:14px; width:10px; height:10px; border-radius:50%;
    background:var(--md-surface-container-lowest); border:2px solid var(--md-on-surface-variant); z-index:1;
  }
  .item.cat-paris::before{border-color:var(--paris);}
  .item.cat-forest::before{border-color:var(--forest);}
  .item.cat-disney::before{border-color:var(--disney);}
  .item.cat-travel::before{border-color:var(--travel);}

  /* ===== M3 filled card ===== */
  .card{
    background:var(--md-surface-container-lowest);
    border-radius:20px;
    padding:16px 18px;
    box-shadow:var(--elev1);
  }
  .card .top{display:flex; justify-content:space-between; gap:10px; align-items:center; flex-wrap:wrap;}
  .top-right{display:flex; align-items:center; gap:8px;}
  .wx{
    display:inline-flex; align-items:center; gap:4px;
    font-family:'Roboto Mono',monospace; font-size:11.5px; font-weight:500;
    color:var(--md-on-surface-variant); background:var(--md-surface-container-low);
    border-radius:100px; padding:3px 9px 3px 6px;
  }
  .wx svg{width:15px;height:15px;flex-shrink:0;}
  .wx .wx-temp{color:var(--md-on-surface); font-weight:600;}
  .wx .wx-sep{opacity:.5;}
  .time{font-family:'Roboto Mono',monospace; font-size:12px; color:var(--md-on-surface-variant); font-weight:500;}
  .tag{
    font-family:'Roboto',sans-serif; font-size:11px; font-weight:600; letter-spacing:.02em;
    padding:3px 10px; border-radius:100px;
  }
  .cat-paris .tag{background:var(--paris-container); color:var(--paris);}
  .cat-forest .tag{background:var(--forest-container); color:var(--forest);}
  .cat-disney .tag{background:var(--disney-container); color:var(--disney);}
  .cat-travel .tag{background:var(--travel-container); color:var(--travel);}

  .card h3{font-family:'Roboto',sans-serif; font-size:16.5px; font-weight:500; margin:8px 0 2px; color:var(--md-on-surface);}
  .card .place{font-size:13px; color:var(--md-on-surface-variant); margin-bottom:8px; line-height:1.4;}
  .card .details{font-size:13px; color:var(--md-on-surface); line-height:1.7; margin-top:6px;
    background:var(--md-surface-container-low); border-radius:12px; padding:10px 12px;}
  .card .details div{display:flex; gap:8px;}
  .card .details .lbl{color:var(--md-on-surface-variant); flex-shrink:0; min-width:78px; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.03em; padding-top:1px;}
  .links{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px;}
  .links a{
    font-size:12.5px; font-weight:500; text-decoration:none;
    border:1px solid var(--md-outline); border-radius:100px; padding:7px 14px; color:var(--md-primary);
    background:var(--md-surface-container-lowest);
    display:inline-flex; align-items:center; gap:4px;
    transition:background .15s ease;
  }
  .links a:hover{background:var(--md-primary-container);}

  .note{font-size:12.5px; color:var(--md-on-surface-variant); margin-top:10px; line-height:1.55;}
  .conflict{
    margin-top:10px; font-size:12.5px; background:var(--warn-container); color:#3D2113;
    padding:10px 12px; border-radius:12px; line-height:1.55; font-weight:500;
  }

  /* gap suggestion block */
  .gap{
    margin:10px 0 18px 0;
    padding:14px 16px;
    border-radius:16px;
    background:var(--md-surface-container);
  }
  .gap .gaphead{
    font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; font-weight:700;
    color:var(--md-primary); margin-bottom:8px;
  }
  .gap ul{margin:0; padding-left:18px; font-size:13.5px; line-height:1.7; color:var(--md-on-surface);}
  .gap li b{font-weight:600;}
  .gap li{margin-bottom:2px;}

  /* Disney strategy section */
  .strategy{
    margin-top:18px; background:var(--disney-container); border-radius:20px; padding:20px 20px;
  }
  .strategy h4{font-family:'Roboto',sans-serif; font-size:15.5px; margin:0 0 12px; color:#3B2E63; font-weight:600;}
  .strategy ol{margin:0; padding-left:20px; font-size:13.5px; line-height:1.75; color:#2E2547;}
  .strategy .transport{display:grid; grid-template-columns:repeat(auto-fit,minmax(148px,1fr)); gap:10px; margin:0 0 16px;}
  .transport .opt{background:rgba(255,255,255,0.55); border-radius:14px; padding:12px 14px;}
  .transport .opt .h{font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:#5B4B85; font-weight:600;}
  .transport .opt .v{font-family:'Roboto',sans-serif; font-size:17px; font-weight:600; margin:2px 0; color:#3B2E63;}
  .transport .opt .d{font-size:11.5px; color:#5B4B85;}

  /* ===== Live status + updates feed ===== */
  .live-status{
    display:flex; align-items:center; gap:8px; font-size:12px; color:var(--md-on-surface-variant);
    padding:2px 2px 12px; flex-wrap:wrap;
  }
  .live-dot{width:8px;height:8px;border-radius:50%; background:var(--md-outline); flex-shrink:0;}
  .live-dot.ok{background:#3D8B5F;}
  .live-dot.checking{background:#B98A20; animation:pulse 1s infinite;}
  .live-dot.error{background:var(--warn);}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  .live-status button{
    margin-left:auto; border:1px solid var(--md-outline); background:var(--md-surface-container-lowest);
    color:var(--md-primary); font-size:11.5px; font-weight:600; border-radius:100px; padding:5px 12px; cursor:pointer;
  }
  .updates-feed{
    background:var(--md-primary-container); color:var(--md-on-primary-container);
    border-radius:16px; padding:14px 16px; margin-bottom:16px; font-size:13px; line-height:1.6;
  }
  .updates-feed .fh{font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; font-weight:700; margin-bottom:8px;}
  .updates-feed ul{margin:0; padding-left:18px;}
  .updates-feed li{margin-bottom:4px;}
  .updates-feed .dismiss{
    margin-top:8px; background:none; border:none; color:var(--md-primary); font-weight:600; font-size:12px;
    cursor:pointer; padding:0; text-decoration:underline;
  }

  /* ===== Trip map card ===== */
  .map-card{
    background:var(--md-surface-container-lowest);
    border-radius:20px;
    padding:16px 18px;
    margin-bottom:18px;
    box-shadow:var(--elev1);
  }
  .map-card .map-head{
    font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; font-weight:700;
    color:var(--md-primary); margin-bottom:10px;
  }
  .map-card iframe{
    width:100%; height:320px; border:0; border-radius:14px; display:block;
  }
  .map-card .map-placeholder{
    font-size:13px; color:var(--md-on-surface-variant); line-height:1.55;
  }

  /* Install prompt banner */
  #installBar{
    display:none; position:sticky; bottom:0; z-index:20;
    background:var(--md-primary); color:var(--md-on-primary);
    padding:12px 18px; font-size:13.5px; align-items:center; justify-content:space-between; gap:12px;
    box-shadow:var(--elev2);
  }
  #installBar button{
    background:var(--md-on-primary); color:var(--md-primary); border:none; border-radius:100px;
    padding:8px 16px; font-weight:600; font-size:13px; cursor:pointer;
  }
  #installBar .x{background:none; color:var(--md-on-primary); font-size:18px; padding:4px 8px;}

  footer{margin:32px 16px 0; padding-top:16px; border-top:1px solid var(--md-outline-variant);
    font-size:11.5px; color:var(--md-on-surface-variant); text-align:center;}

  @media (max-width:600px){
    .content{padding:14px 12px 0;}
  }
</style>
</head>

/* ===== Weather badges ===== */
// Four rough zones cover every stop on the trip — good enough for "what to
// wear", not trying to be a forecasting app in its own right.
const WX_LOCATIONS = {
  home:   { lat: 51.0806, lon: 1.1631, tz: 'Europe/London' }, // Folkestone terminal
  calais: { lat: 50.9513, lon: 1.8587, tz: 'Europe/Paris' },  // Calais/Coquelles terminal
  paris:  { lat: 48.8566, lon: 2.3522, tz: 'Europe/Paris' },  // central Paris / Eiffel Tower
  resort: { lat: 48.8687, lon: 2.7778, tz: 'Europe/Paris' }   // Villages Nature / Disneyland area
};
const WX_END_DATE = '2026-09-05';
const weatherCache = {}; // locKey -> { "YYYY-MM-DDTHH:00": {temp, wind, code} }

const WX_ICON = {
  sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  cloudSun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 5v-2M4.2 6.2l-1.4-1.4M3 9.5h-2" stroke-opacity=".9"/><circle cx="7" cy="9" r="2.5"/><path d="M8 20h9a4 4 0 0 0 .6-7.95A5.5 5.5 0 0 0 7.2 10.6"/></svg>',
  cloud: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 19h11a4 4 0 0 0 .4-7.98A6 6 0 0 0 6.2 12.1 4 4 0 0 0 6.5 19z"/></svg>',
  fog: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 8h16M4 12h16M4 16h10"/></svg>',
  rain: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 15h11a4 4 0 0 0 .4-7.98A6 6 0 0 0 6.2 8.1 4 4 0 0 0 6.5 15z"/><path d="M8 18l-1 2M12 18l-1 2M16 18l-1 2" stroke-linejoin="round"/></svg>',
  snow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 13h11a4 4 0 0 0 .4-7.98A6 6 0 0 0 6.2 6.1 4 4 0 0 0 6.5 13z"/><path d="M8 17v4M6 18.5l4 1M10 18.5l-4 1M16 17v4M14 18.5l4 1M18 18.5l-4 1"/></svg>',
  storm: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 13h10a4 4 0 0 0 .4-7.98A6 6 0 0 0 6.2 6.1 4 4 0 0 0 6.5 13z"/><path d="M13 13l-3 5h3l-2 4"/></svg>'
};
function wxIconFor(code){
  if(code === 0) return WX_ICON.sun;
  if(code === 1 || code === 2) return WX_ICON.cloudSun;
  if(code === 3) return WX_ICON.cloud;
  if(code === 45 || code === 48) return WX_ICON.fog;
  if([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(code)) return WX_ICON.rain;
  if([71,73,75,77,85,86].includes(code)) return WX_ICON.snow;
  if([95,96,99].includes(code)) return WX_ICON.storm;
  return WX_ICON.cloud;
}

async function loadWeather(){
  const today = new Date().toISOString().slice(0,10);
  await Promise.all(Object.entries(WX_LOCATIONS).map(async ([key, loc]) => {
    try{
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}` +
        `&hourly=temperature_2m,weathercode,wind_speed_10m&timezone=${encodeURIComponent(loc.tz)}` +
        `&start_date=${today}&end_date=${WX_END_DATE}`;
      const res = await fetch(url, {cache:'no-store'});
      const data = await res.json();
      const map = {};
      (data.hourly.time || []).forEach((t, i) => {
        map[t] = {
          temp: Math.round(data.hourly.temperature_2m[i]),
          wind: Math.round(data.hourly.wind_speed_10m[i]),
          code: data.hourly.weathercode[i]
        };
      });
      weatherCache[key] = map;
    }catch(err){
      // Weather is a nice-to-have — fail quietly, badges just won't show.
    }
  }));
  renderAllWeatherBadges();
}

function renderAllWeatherBadges(){
  document.querySelectorAll('.wx-slot').forEach(slot => {
    const key = slot.dataset.wx, when = slot.dataset.when;
    if(!key || !when || !weatherCache[key]) return;
    // round the target time to the nearest hour key Open-Meteo actually returned
    const target = when.slice(0,13) + ':00';
    const reading = weatherCache[key][target];
    if(!reading) return;
    slot.innerHTML = `<span class="wx">${wxIconFor(reading.code)}<span class="wx-temp">${reading.temp}°</span><span class="wx-sep">·</span>${reading.wind} km/h</span>`;
  });
}

if(new Date() <= new Date(WX_END_DATE + 'T23:59:59')){
  loadWeather();
  setInterval(loadWeather, 90 * 60 * 1000);
}

/* ===== Live updates: poll the Apps Script feed every 90 min, until 5 Sep 2026 ===== */
const LIVE_CONFIG = {
  // Paste the /exec URL from your Apps Script deployment here (see Code.gs).
  scriptUrl: 'https://script.google.com/macros/s/AKfycbxXJRcze0n4_rMayYhzz02wuSIdRSKTwMSccgTyAkbj4MgqQxMEOIoBXV1mZTRmmDibBg/exec',
  endDate: '2026-09-05T23:59:59',
  intervalMs: 90 * 60 * 1000 // 90 minutes
};

const liveDot = document.getElementById('liveDot');
const liveText = document.getElementById('liveText');
const updatesFeed = document.getElementById('updatesFeed');
const checkNowBtn = document.getElementById('checkNowBtn');

function configured(){
  return LIVE_CONFIG.scriptUrl && !LIVE_CONFIG.scriptUrl.startsWith('PASTE_');
}
function withinLiveWindow(){
  return new Date() <= new Date(LIVE_CONFIG.endDate);
}
function setLiveStatus(state, extra){
  liveDot.className = 'live-dot' + (state ? ' ' + state : '');
  if(!configured()){
    liveText.textContent = 'Live updates not yet configured (add your Apps Script URL)';
  } else if(!withinLiveWindow()){
    liveText.textContent = 'Live updates ended (trip window closed 5 Sep)';
  } else if(state === 'checking'){
    liveText.textContent = 'Checking Gmail & Calendar…';
  } else if(state === 'error'){
    liveText.textContent = 'Couldn\'t reach the live feed — will retry automatically';
  } else if(state === 'ok'){
    const t = extra ? extra.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : '';
    liveText.textContent = `Checked ${t} · next check in ~90 min`;
  }
}

function renderUpdatesFeed(newEmails, newEvents){
  if(!newEmails.length && !newEvents.length){ updatesFeed.innerHTML = ''; return; }
  let html = `<div class="updates-feed"><div class="fh">New since your last check</div><ul>`;
  newEvents.forEach(ev => {
    const d = new Date(ev.start);
    html += `<li><b>${ev.title}</b> — ${d.toLocaleDateString([], {weekday:'short', day:'numeric', month:'short'})}, ${ev.allDay ? 'all day' : d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}${ev.location ? ' · ' + ev.location : ''}</li>`;
  });
  newEmails.forEach(em => {
    html += `<li><b>Email:</b> ${em.subject} <span style="opacity:.75">(${em.from.replace(/<.*>/,'').trim()})</span></li>`;
  });
  html += `</ul><button class="dismiss" id="dismissFeed">Got it, hide this</button></div>`;
  updatesFeed.innerHTML = html;
  document.getElementById('dismissFeed').onclick = () => { updatesFeed.innerHTML = ''; };
}

async function checkForUpdates(){
  if(!configured() || !withinLiveWindow()){ setLiveStatus(); return; }
  setLiveStatus('checking');
  try{
    const res = await fetch(LIVE_CONFIG.scriptUrl, {cache:'no-store'});
    const data = await res.json();

    const seenEmails = JSON.parse(localStorage.getItem('seenEmailIds') || '[]');
    const seenEvents = JSON.parse(localStorage.getItem('seenEventMap') || '{}');

    const newEmails = (data.emails || []).filter(e => !seenEmails.includes(e.id));
    const newOrChangedEvents = (data.events || []).filter(ev => seenEvents[ev.id] !== ev.lastUpdated);

    // Don't flood the feed on the very first-ever check (that's just "everything
    // in range", not "new") — only show deltas once we have a baseline.
    const hadBaseline = localStorage.getItem('lastChecked') !== null;
    if(hadBaseline){
      renderUpdatesFeed(newEmails, newOrChangedEvents);
    }

    localStorage.setItem('seenEmailIds', JSON.stringify((data.emails || []).map(e => e.id)));
    const eventMap = {};
    (data.events || []).forEach(ev => { eventMap[ev.id] = ev.lastUpdated; });
    localStorage.setItem('seenEventMap', JSON.stringify(eventMap));
    localStorage.setItem('lastChecked', new Date().toISOString());

    setLiveStatus('ok', new Date());
  }catch(err){
    setLiveStatus('error');
  }
}

checkNowBtn.addEventListener('click', checkForUpdates);

if(configured() && withinLiveWindow()){
  const last = localStorage.getItem('lastChecked');
  const due = !last || (Date.now() - new Date(last).getTime()) > LIVE_CONFIG.intervalMs;
  if(due) checkForUpdates(); else setLiveStatus('ok', new Date(last));
  setInterval(checkForUpdates, LIVE_CONFIG.intervalMs);
} else {
  setLiveStatus();
}
let deferredPrompt;
const installBar = document.getElementById('installBar');
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  if (!localStorage.getItem('installDismissed')) installBar.style.display = 'flex';
});
document.getElementById('installBtn').addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  installBar.style.display = 'none';
});
document.getElementById('dismissInstall').addEventListener('click', () => {
  installBar.style.display = 'none';
  localStorage.setItem('installDismissed', '1');
});
